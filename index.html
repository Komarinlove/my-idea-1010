<!doctype html>
<html lang="en">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Pulse</title>
<style>
:root{--bg:#0b1220;--card:#131c2f;--card2:#18233b;--line:#25335a;--text:#e8eefc;--muted:#9aaacb;--accent:#5eead4;--up:#2fd08a;--down:#ff5d6c;--up-bg:rgba(47,208,138,.14);--down-bg:rgba(255,93,108,.14)}
body[data-color=jp]{--up:#ff6b78;--down:#55a8ff;--up-bg:rgba(255,107,120,.15);--down-bg:rgba(85,168,255,.15)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(900px 420px at 80% -10%,#16264a 0,transparent 60%),var(--bg);color:var(--text);font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 0 12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-size:18px;margin:0;letter-spacing:.2px;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:11px;line-height:1.2}
.hr{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:999px;font-size:13px;color:var(--muted);min-height:32px}
.seg button[aria-pressed=true]{background:var(--accent);color:#06241f;font-weight:700}
.btn{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(94,234,212,.12);color:var(--accent);border:1px solid rgba(94,234,212,.35)}
#settings{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;animation:pop .2s ease}
#settings[hidden]{display:none}
#settings h3{margin:12px 0 8px;font-size:13px;color:var(--muted);font-weight:600}
#settings h3:first-child{margin-top:0}
.selbox{width:100%;max-width:340px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;min-height:34px}
.chip[aria-pressed=true]{border-color:var(--accent);background:rgba(94,234,212,.14);color:var(--accent);font-weight:600}
.chip[aria-pressed=true]::before{content:"✓ "}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.sbox .lb{font-size:12px;color:var(--muted)}
.sbox .vl{font-size:18px;font-weight:700;display:flex;gap:12px;flex-wrap:wrap}
.u{color:var(--up)}.d{color:var(--down)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:4px 0 10px}
.meta{font-size:12px;color:var(--muted)}
.layout{display:grid;gap:16px}
.legend{font-size:12px;color:var(--muted);margin:0 0 8px}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;transition:transform .12s,border-color .12s}
.item:hover{border-color:#3a4d86}
.item.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.row{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(70px,1fr) auto 12px;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-radius:14px 14px 0 0;padding:12px 12px 6px}
.tfs{display:flex;gap:6px;padding:0 12px 10px;flex-wrap:wrap}
.tfb{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);min-height:28px}
.tfb:hover{border-color:var(--accent)}
.rmb{margin-left:auto;color:var(--muted)}
.rmb:hover{border-color:var(--down);color:var(--down)}
.tfb[aria-pressed=true]{background:rgba(94,234,212,.16);border-color:var(--accent);color:var(--accent);font-weight:700}
.nm{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd{color:var(--muted);font-size:11px;margin-left:4px;font-weight:400}
.pr{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.spark{width:100%;height:40px;display:block}
.up{color:var(--up)}.down{color:var(--down)}
.base{stroke:var(--muted);stroke-opacity:.5;stroke-width:1;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.rc{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.chg{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.fc{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:13px;padding:2px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.fc.up{background:var(--up-bg)}.fc.down{background:var(--down-bg)}
.fc i{font-style:normal;font-size:16px;line-height:1}
#detail{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;transform:translateY(100%);visibility:hidden;transition:transform .25s ease,visibility .25s}
body.dopen #detail{transform:none;visibility:visible}
body.dopen{overflow:hidden}
.dwrap{max-width:640px;margin:0 auto;padding:12px 14px 40px}
.dtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.dh{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.dh h2{margin:0;font-size:20px}
.big-pr{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.big{width:100%;height:auto;display:block;margin-top:8px}
.xl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stats div{background:var(--card2);border-radius:10px;padding:6px 8px;font-size:12px;color:var(--muted)}
.stats b{display:block;color:var(--text);font-size:13px;font-variant-numeric:tabular-nums}
.fhead{display:flex;align-items:center;gap:12px}
.arrow{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:34px;font-weight:800;flex:none;animation:pop .35s ease}
.arrow.up{background:var(--up-bg)}.arrow.down{background:var(--down-bg)}
.ft{font-size:18px;font-weight:800}
.fs{font-size:12px;color:var(--muted)}
.rng{position:relative;height:12px;border-radius:999px;margin:34px 6px 8px;background:linear-gradient(90deg,var(--down),#44507a 50%,var(--up))}
.mk{position:absolute;top:-8px;width:4px;height:28px;background:#fff;border-radius:3px;transform:translateX(-2px)}
.mk span{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);font-size:11px;background:#fff;color:#0b1220;border-radius:6px;padding:1px 6px;white-space:nowrap;font-weight:700}
.rl{display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums}
.rl small{display:block;color:var(--muted);font-size:11px}
.rl div:last-child{text-align:right}
h3.sec{margin:0 0 8px;font-size:15px}
ul.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.news li{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:start;background:var(--card2);border-radius:10px;padding:9px 10px;font-size:13px}
.ago{color:var(--muted);font-size:12px;padding-top:1px}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
.tag.up{background:var(--up-bg)}.tag.down{background:var(--down-bg)}.tag.neu{background:#2a3556;color:var(--muted)}
.wsvg{width:100%;height:auto;display:block;margin:4px 0 6px}
.anr{display:grid;grid-template-columns:1fr auto;gap:2px 8px;background:var(--card2);border-radius:10px;padding:9px 10px;font-size:13px;margin-top:8px}
.anr small{grid-column:1/-1;color:var(--muted);font-size:12px}
button.anr{width:100%;text-align:left;border:1px solid transparent}
button.anr:hover{border-color:var(--accent)}
button.anr[aria-pressed=true]{border-color:var(--accent);background:rgba(94,234,212,.1)}
.tgtcap{font-size:12px;color:var(--muted);margin-top:8px}
.disc{font-size:11px;color:var(--muted);margin-top:14px}
.guide{background:linear-gradient(135deg,#16264a,#13213d);border:1px solid var(--accent);border-radius:16px;padding:14px;margin-bottom:14px;animation:pop .25s ease}
.guide[hidden]{display:none}
.guide h2{margin:0 0 8px;font-size:16px}
.guide ol{margin:0 0 12px;padding-left:22px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.guide ol li::marker{color:var(--accent);font-weight:800}
.gact{display:flex;gap:8px;flex-wrap:wrap}
.btn.pri{background:var(--accent);color:#06241f;border-color:var(--accent);font-weight:700}
.chev{color:var(--muted);font-size:22px;line-height:1}
.addbtn{width:100%;margin-top:10px;justify-content:center;border-style:dashed;border-color:var(--accent);color:var(--accent);font-weight:700;min-height:46px;border-radius:14px}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
#addSheet{position:fixed;inset:0;z-index:40;background:rgba(3,8,18,.7);display:flex;align-items:flex-end;justify-content:center}
#addSheet[hidden]{display:none}
.sheet{width:100%;max-width:480px;max-height:82vh;overflow:auto;background:var(--card);border:1px solid var(--accent);border-radius:18px 18px 0 0;padding:14px;animation:pop .2s ease}
@media(min-width:600px){#addSheet{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin:0 0 4px;font-size:17px}
.sheet p{margin:0 0 10px;font-size:12px;color:var(--muted)}
.opt{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;text-align:left;min-height:48px}
.opt:hover{border-color:var(--accent)}
.opt b{font-size:15px}
.opt .plus{color:var(--accent);font-weight:800;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#e8eefc;color:#0b1220;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.pxg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pxg label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.pxg input{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;font-variant-numeric:tabular-nums;width:100%}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:380px){.brand small{display:none}.row{grid-template-columns:minmax(0,1fr) 64px auto 10px}}
@media(min-width:900px){
 .layout{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}
 #detail{position:sticky;top:12px;transform:none;visibility:visible;inset:auto;background:transparent;overflow:visible;max-height:calc(100vh - 24px);overflow-y:auto;z-index:1}
 body.dopen{overflow:auto}
 .dwrap{padding:0}
 .dtop .btn{display:none}
 .dtop{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-color="gl">
<div class="wrap">
<header>
 <div class="brand">
  <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="10" fill="#18233b" stroke="#5eead4" stroke-opacity=".5"/><polyline points="5,21 11,21 14,10 19,27 23,16 26,21 31,21" fill="none" stroke="#5eead4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>

 </div>

 </div>

 </div>
 <h3 data-i18n="pxLabel"></h3>
 <p class="meta" style="margin:0 0 8px" data-i18n="pxHint"></p>
 <div class="pxg" id="pxList" data-demo="price-list"></div>
 <button class="btn" id="pxReset" data-demo="price-reset" style="margin-top:10px" data-i18n="pxReset"></button>
</section>

<section class="guide" id="guide" data-demo="guide">
 <h2 data-i18n="guideTitle"></h2>
 <ol><li data-i18n="g1"></li><li data-i18n="g2"></li><li data-i18n="g3"></li></ol>
 <div class="gact">
  <button class="btn pri" id="guideTry" data-demo="guide-try" data-i18n="guideTry"></button>
  <button class="btn" id="guideClose" data-demo="guide-close" data-i18n="guideClose"></button>
 </div>
</section>

<div class="summary" data-demo="summary">
 <div class="sbox"><div class="lb" data-i18n="sumMove"></div><div class="vl" id="sumMove"></div></div>
 <div class="sbox"><div class="lb" data-i18n="sumFc"></div><div class="vl" id="sumFc"></div></div>
</div>

<div class="layout">
 <main>
  <div class="bar">
   <div class="seg" role="group" data-i18n-aria="sortAria">
    <button id="sDef" data-demo="sort-default" aria-pressed="true" data-i18n="sortDef"></button>
    <button id="sMov" data-demo="sort-move" aria-pressed="false" data-i18n="sortMove"></button>
   </div>
   <div style="display:flex;gap:8px">
   <button class="btn" id="helpBtn" data-demo="help-toggle">？ <span data-i18n="help"></span></button>
   <button class="btn" id="refBtn" data-demo="refresh">↻ <span data-i18n="refresh"></span></button>
   </div>
  </div>
  <p class="meta" id="metaLine" style="margin:0 0 4px"></p>
  <p class="legend" data-i18n="legend"></p>
  <div class="list" id="list" data-demo="stock-list"></div>
  <button class="btn addbtn" id="addBtn" data-demo="add-instrument">＋ <span data-i18n="addIns"></span></button>
 </main>
 <aside id="detail" aria-live="polite" data-demo="detail-panel">
  <div class="dwrap">
   <div class="dtop"><button class="btn" id="closeBtn" data-demo="detail-close">← <span data-i18n="back"></span></button><span class="badge" data-i18n="sample"></span></div>
   <div id="detailBody"></div>
  </div>
 </aside>
</div>
<p class="disc" data-i18n="disclaimer"></p>
</div>
<div id="addSheet" hidden data-demo="add-sheet">
 <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="addTitle">
  <h2 id="addTitle" data-i18n="addTitle"></h2>
  <p data-i18n="addHint"></p>
  <input class="selbox" id="addQ" type="search" data-demo="add-search" data-i18n-ph="addSearch" data-i18n-aria="addSearch" style="max-width:none;margin-bottom:8px">
  <div id="addList" data-demo="add-list"></div>
  <h3 class="sec" style="margin:14px 0 6px" data-i18n="cusTitle"></h3>
  <div class="pxg" style="grid-template-columns:1fr 1fr;margin-bottom:8px" data-demo="custom-form">
   <label><span data-i18n="cusName"></span><input id="cName" type="text" maxlength="24" data-demo="custom-name"></label>
   <label><span data-i18n="cusCode"></span><input id="cCode" type="text" maxlength="10" data-demo="custom-code"></label>
   <label><span data-i18n="cusPrice"></span><input id="cPrice" type="text" inputmode="decimal" data-demo="custom-price"></label>
   <label><span data-i18n="cusCur"></span><select id="cCur" class="selbox" data-demo="custom-currency"><option value="JPY" data-i18n="uJPYopt"></option><option value="USD" data-i18n="uUSDopt"></option><option value="pt" data-i18n="uPtOpt"></option></select></label>
  </div>
  <button class="btn" id="cAdd" data-demo="custom-add" style="width:100%;justify-content:center;margin-bottom:10px" data-i18n="cusBtn"></button>
  <p data-i18n="cusNote"></p>
  <button class="btn pri" id="addDone" data-demo="add-done" style="width:100%;justify-content:center" data-i18n="done"></button>
 </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const I18N={
ja:{title:"マーケットパルス",appName:"マーケットパルス",tagline:"値動きと今日の予想をひと目で",settings:"設定",langAria:"言語切り替え",
baseLabel:"標準の表示期間（全銘柄に適用。銘柄ごとにも変更できます）",pickLabel:"表示する銘柄（複数選べます）",colorLabel:"上昇・下落の色",colorJp:"上昇＝赤 / 下落＝青",colorGl:"上昇＝緑 / 下落＝赤",
tfs_5m:"5分",tfs_15m:"15分",tfs_1h:"1時間",tfs_4h:"4時間",tfs_1d:"1日",
tfl_5m:"直近5分",tfl_15m:"直近15分",tfl_1h:"直近1時間",tfl_4h:"直近4時間",tfl_1d:"直近1日（24時間）",
tfAria:"{n}の表示期間",
sumMove:"上昇・下落（各銘柄の表示期間）",sumFc:"今日の予想",up:"上昇",down:"下落",upN:"↑ {n}銘柄",downN:"↓ {n}銘柄",
sortAria:"並べ替え",sortDef:"設定順",sortMove:"動きの大きい順",refresh:"更新",updated:"最終更新 {t}",
legend:"チャートと変化率は、各行の下のボタンで選んだ期間。右側の ↑↓ は今日の予想（％は確度）。タップで詳細。",
back:"一覧へ",close:"閉じる",sample:"サンプルデータ",
fcTitle:"今日の予想",likelyUp:"今日は上がりそう",likelyDown:"今日は下がりそう",conf:"確度 {p}%（サンプル）",newsMix:"直近24時間の材料：強気 {a} / 弱気 {b}",
rangeTitle:"今日の予想レンジ",lowT:"下値の目安",highT:"上値の目安",nowT:"現在",
baseV:"期間の始値",wHigh:"期間高値",wLow:"期間安値",
fund:"直近24時間のファンダ",bull:"↑ 強気",bear:"↓ 弱気",neu:"→ 中立",agoH:"{h}時間前",agoM:"{m}分前",
pick:"銘柄をタップすると、今日の予想レンジとファンダが表示されます。",
minOne:"銘柄は最低1つ必要です",refreshed:"サンプルデータを更新しました",saved:"標準の表示期間を変更しました",

  const ins=o.m.ins,c=o.chg>=0?"up":"down",f=o.m.up?"up":"down";
  const al=t("rowAria",{n:ins.n[lang],c:pct(o.chg),f:t(o.m.up?"fcUp":"fcDown")});
  return `<div class="item ${S.cur===o.id?"sel":""}"><button class="row" data-id="${o.id}" data-demo="stock-${o.id}" aria-label="${al}">
  <div><div class="nm">${ins.n[lang]}<span class="cd">${ins.code}</span></div><div class="pr">${fmt(o.m.price,ins)}</div></div>
  <div class="${c}">${chart(o.w,100,40,false)}</div>
  <div class="rc"><span class="chg ${c==="up"?"u":"d"}">${pct(o.chg)}</span><span class="fc ${f}"><i>${o.m.up?"↑":"↓"}</i>${o.m.prob}%</span></div><span class="chev" aria-hidden="true">›</span></button>${tfBar(o.id,o.tf,"tf",true)}</div>`}).join("");
 const nu=items.filter(o=>o.chg>=0).length,fu=items.filter(o=>o.m.up).length;
 $("#sumMove").innerHTML=`<span class="u">${t("upN",{n:nu})}</span><span class="d">${t("downN",{n:items.length-nu})}</span>`;
 $("#sumFc").innerHTML=`<span class="u">${t("upN",{n:fu})}</span><span class="d">${t("downN",{n:items.length-fu})}</span>`;
 const hh=String(stamp.getHours()).padStart(2,"0")+":"+String(stamp.getMinutes()).padStart(2,"0");
 $("#metaLine").textContent=t("updated",{t:hh});
}
function agoT(h){return t("agoH",{h:Math.max(1,Math.round(h))})}
let anSel=0;
function anAgo(h){return h<1?t("agoM",{m:Math.max(1,Math.round(h*60))}):t("agoH",{h:Math.round(h)})}
function anTime(a){const d=new Date(stamp.getTime()-a.h*3600000),p=n=>String(n).padStart(2,"0");return p(d.getHours())+":"+p(d.getMinutes())}
function anChart(m){
 const a=m.an[anSel]||m.an[0],ins=m.ins,v=ds(m.series),W=300,H=130,FX=215,up=a.s>0;
 const all=v.concat([a.tg,m.price]),mn=Math.min(...all),mx=Math.max(...all),sp=(mx-mn)||1;
 const Y=x=>10+(1-(x-mn)/sp)*(H-20),X=i=>i/(v.length-1)*FX;
 const pts=v.map((x,i)=>X(i).toFixed(1)+","+Y(x).toFixed(1)).join(" "),mx0=((1-a.h/24)*FX).toFixed(1);
 const yN=Y(m.price).toFixed(1),yT=Y(a.tg).toFixed(1),col=up?"var(--up)":"var(--down)",ly=(+yT<22)?(+yT+14):(+yT-5);
 return `<svg class="wsvg" viewBox="0 0 ${W} ${H}" style="margin-top:10px" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="#5eead4" stroke-width="2" stroke-linejoin="round"/><line x1="${mx0}" x2="${mx0}" y1="2" y2="${H-2}" style="stroke:var(--muted)" stroke-dasharray="3 3"/><line x1="0" x2="${W}" y1="${yT}" y2="${yT}" stroke="${col}" stroke-opacity=".45" stroke-dasharray="2 4"/><line x1="${FX}" y1="${yN}" x2="${W-4}" y2="${yT}" stroke="${col}" stroke-width="2.4" stroke-dasharray="5 4"/><circle cx="${FX}" cy="${yN}" r="4" fill="#5eead4"/><circle cx="${W-4}" cy="${yT}" r="5" fill="${col}"/><text x="${W-8}" y="${ly}" text-anchor="end" style="fill:var(--text);font-size:11px">${t("anTgtShort")} ${fmt(a.tg,ins)}</text></svg><div class="tgtcap">${t("anCap",{n:a.name[lang],t:anTime(a)})}</div>`;
}
function waveCard(m){
 const P=[[5,60],[50,30],[80,45],[170,8],[205,28],[250,15]],L="①②③④⑤",cur=P[m.wv];
 const pl=a=>a.map(p=>p.join(",")).join(" ");
 const lab=P.slice(1).map((p,i)=>`<text x="${p[0]-4}" y="${p[1]+(i%2===0?-6:15)}" style="fill:var(--muted);font-size:12px">${L[i]}</text>`).join("");
 const rows=m.an.map((a,i)=>`<button class="anr" data-an="${i}" data-demo="analyst-${i}" aria-pressed="${i===anSel}"><b>${a.name[lang]}</b><span class="tag ${a.s>0?"up":"down"}">${t(a.s>0?"bull":"bear")}</span><small>${t(a.s>0?"wBull":"wBear",{w:m.wv})}</small><small>🕒 ${t("anAt",{t:anTime(a),h:anAgo(a.h)})}</small><small>🎯 ${t("anTgt",{p:fmt(a.tg,m.ins),c:pct(a.tg/m.price-1)})}</small></button>`).join("");
 return `<div class="card" data-demo="wave-card"><h3 class="sec">${t("waveTitle")}</h3>
 <svg class="wsvg" viewBox="0 0 300 72" aria-hidden="true"><polyline points="${pl(P.slice(m.wv))}" fill="none" style="stroke:var(--muted)" stroke-width="1.6" stroke-dasharray="4 4"/><polyline points="${pl(P.slice(0,m.wv+1))}" fill="none" stroke="#5eead4" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>${lab}<circle cx="${cur[0]}" cy="${cur[1]}" r="5" fill="#5eead4"/></svg>
 <div class="fs">${t("waveNow",{w:m.wv,a:m.wb,b:m.wr})}</div>${rows}<div data-demo="analyst-chart">${anChart(m)}</div><div class="disc" style="margin-top:8px">${t("waveNote")}</div></div>`;
}
function renderDetail(){
 const el=$("#detailBody");
 if(!S.cur){el.innerHTML=`<p class="empty">${t("pick")}</p>`;return}
 const o=calc(S.cur),m=o.m,ins=m.ins,c=o.chg>=0?"up":"down",f=m.up?"up":"down";
 const mn=Math.min(...o.w),mx=Math.max(...o.w),span=m.hi-m.lo,pos=Math.max(0,Math.min(100,(m.price-m.lo)/span*100));
 el.innerHTML=`
 <div class="card"><div class="dh"><div><h2>${ins.n[lang]} <span class="cd">${ins.code}</span></h2><div class="meta">${t("tfl_"+o.tf)}</div><div class="meta" data-demo="unit-note">💱 ${unitText(ins)}</div></div>
 <div style="text-align:right"><div class="big-pr">${fmt(m.price,ins)}</div><div class="meta">${t(S.px[S.cur]?"pxReal":"pxSamp")}</div><div class="chg ${c==="up"?"u":"d"}">${pct(o.chg)}</div></div></div>
 <div class="pxg" style="margin-top:8px;grid-template-columns:1fr"><label>${t("pxNow")}<input type="text" inputmode="decimal" id="dPx" data-id="${S.cur}" data-demo="detail-price" value="${S.px[S.cur]||""}" placeholder="${ins.pre}${ins.base}"></label></div>
 <div class="${c}">${chart(o.w,300,120,true)}</div>
 <div class="xl"><span>${t("tfl_"+o.tf)}</span><span>${t("nowT")}</span></div>
 <div style="margin-top:8px">${tfBar(S.cur,o.tf,"dtf").replace('class="tfs"','class="tfs" style="padding:0"')}</div>
 <div class="stats"><div>${t("baseV")}<b>${fmt(o.w[0],ins)}</b></div><div>${t("wHigh")}<b>${fmt(mx,ins)}</b></div><div>${t("wLow")}<b>${fmt(mn,ins)}</b></div></div></div>
 <div class="card" data-demo="forecast-card"><h3 class="sec">${t("fcTitle")} <span class="badge">${asOf()}</span></h3>
 <div class="fhead"><div class="arrow ${f}">${m.up?"↑":"↓"}</div><div><div class="ft ${f==="up"?"u":"d"}">${t(m.up?"likelyUp":"likelyDown")}</div><div class="fs">${t("conf",{p:m.prob})}</div><div class="fs">${t("newsMix",{a:m.bull,b:m.bear})}</div><div class="fs" style="margin-top:4px">${t("basis")}</div></div></div>
 <h3 class="sec" style="margin-top:16px">${t("rangeTitle")}</h3>
 <div class="rng"><div class="mk" style="left:${pos}%"><span>${t("nowT")}</span></div></div>
 <div class="rl"><div><small>${t("lowT")}</small><b class="d">${fmt(m.lo,ins)}</b></div><div><small>${t("highT")}</small><b class="u">${fmt(m.hi,ins)}</b></div></div></div>
 ${waveCard(m)}
 <div class="card" data-demo="fundamentals"><h3 class="sec">${t("fund")}</h3><ul class="news">${m.news.map(n=>`<li><span class="ago">${agoT(n.h)}</span><span>${n[lang]}</span><span class="tag ${n.s>0?"up":n.s<0?"down":"neu"}">${t(n.s>0?"bull":n.s<0?"bear":"neu")}</span></li>`).join("")}</ul></div>`;
}
function renderSettings(){
 $("#baseSel").innerHTML=TFS.map(b=>`<option value="${b}" ${b===S.base?"selected":""}>${t("tfl_"+b)}</option>`).join("");
 $("#chips").innerHTML=INS.map(i=>`<button class="chip" data-id="${i.id}" data-demo="chip-${i.id}" aria-pressed="${S.sel.includes(i.id)}">${i.n[lang]}</button>`).join("");
 const eff=S.color||(lang==="ja"?"jp":"gl");
 document.body.dataset.color=eff;
 $("#cJp").setAttribute("aria-pressed",eff==="jp");$("#cGl").setAttribute("aria-pressed",eff==="gl");
 [["cyOrig","orig"],["cyJPY","JPY"],["cyUSD","USD"]].forEach(([i,v])=>$("#"+i).setAttribute("aria-pressed",S.ccy===v));
 const ae=document.activeElement;
 if(!(ae&&ae.closest&&ae.closest("#pxList")))$("#pxList").innerHTML=INS.map(i=>`<label>${i.n[lang]}<input type="text" inputmode="decimal" data-id="${i.id}" data-demo="price-${i.id}" value="${S.px[i.id]||""}" placeholder="${i.pre}${i.base}"></label>`).join("");
 $("#sDef").setAttribute("aria-pressed",S.sort==="def");$("#sMov").setAttribute("aria-pressed",S.sort==="move");
}
function applyStatic(){
 document.documentElement.lang=lang;document.title=t("title");
 document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
 document.querySelectorAll("[data-i18n-aria]").forEach(e=>e.setAttribute("aria-label",t(e.dataset.i18nAria)));
 document.querySelectorAll("[data-i18n-ph]").forEach(e=>e.setAttribute("placeholder",t(e.dataset.i18nPh)));
 $("#closeBtn").setAttribute("aria-label",t("close"));
 document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
}
function renderAdd(){
 const q=($("#addQ").value||"").trim().toLowerCase(),rest=INS.filter(i=>!S.sel.includes(i.id)&&(!q||(i.n.ja+" "+i.n.en+" "+i.code).toLowerCase().includes(q)));
 const rq=($("#addQ").value||"").trim().replace(/[<>&"']/g,"").slice(0,24);
 $("#addList").innerHTML=(rest.length?rest.map(i=>`<button class="opt" data-id="${i.id}" data-demo="add-${i.id}"><span><b>${i.n[lang]}</b> <span class="cd">${i.code}</span></span><span class="plus">＋</span></button>`).join(""):`<p class="empty">${t(q?"noMatch":"allAdded")}</p>`)
 +(rq?`<button class="opt" id="useQ" data-demo="add-use-query"><span><b>${t("useQ",{q:rq})}</b></span><span class="plus">＋</span></button>`:"");
}
function render(){ensureCur();applyStatic();renderSettings();renderList();renderDetail();renderAdd()}
let tt;
function toast(msg){const e=$("#toast");e.textContent=msg;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),2200)}
function openDetail(id){
 S.cur=id;anSel=0;renderList();renderDetail();
 if(!isDesk()){document.body.classList.add("dopen");$("#detail").scrollTop=0;setTimeout(()=>$("#closeBtn").focus(),50)}
}
function closeDetail(){
 const id=S.cur;document.body.classList.remove("dopen");
 if(!isDesk()){S.cur=null;renderList();const r=document.querySelector(`.row[data-id="${id}"]`);if(r)r.focus()}
}
function setTf(b){
 const id=b.dataset.id,tf=b.dataset.tf,demo=b.dataset.demo;
 S.tf[id]=tf;saveS();renderList();if(S.cur===id)renderDetail();
 const nb=document.querySelector(`[data-demo="${demo}"]`);if(nb)nb.focus();
}
$("#list").addEventListener("click",e=>{
 const rb=e.target.closest(".rmb");
 if(rb){
  const id=rb.dataset.rm,i=S.sel.indexOf(id);
  if(S.sel.length<=1){toast(t("minOne"));return}
  const nm=INS.find(x=>x.id===id).n[lang];
  if(i>=0)S.sel.splice(i,1);
  if(S.cur===id)S.cur=null;
  saveS();render();toast(t("removed",{n:nm}));return}
 const tb=e.target.closest(".tfb");if(tb){setTf(tb);return}
 const b=e.target.closest(".row");if(b)openDetail(b.dataset.id)
});
$("#detailBody").addEventListener("click",e=>{
 const an=e.target.closest(".anr");if(an){anSel=+an.dataset.an;renderDetail();const nb=document.querySelector(`[data-demo="analyst-${anSel}"]`);if(nb)nb.focus();return}
 const tb=e.target.closest(".tfb");if(tb)setTf(tb)});
$("#closeBtn").addEventListener("click",closeDetail);
$("#detailBody").addEventListener("change",e=>{
 const i=e.target.closest("#dPx");if(!i)return;
 const v=parseFloat(i.value.replace(/[,，\s$]/g,""));
 if(v>0)S.px[i.dataset.id]=v;else delete S.px[i.dataset.id];
 cache={};stamp=new Date();saveS();render();toast(t("pxSaved"));
});
document.addEventListener("keydown",e=>{
 if(e.key!=="Escape")return;
 if(!$("#addSheet").hidden){$("#addSheet").hidden=true;return}
 if(document.body.classList.contains("dopen"))closeDetail();
});
$("#setBtn").addEventListener("click",()=>{const s=$("#settings"),h=s.hidden;s.hidden=!h;$("#setBtn").setAttribute("aria-expanded",String(h))});
$("#addBtn").addEventListener("click",()=>{renderAdd();$("#addSheet").hidden=false;setTimeout(()=>$("#addDone").focus(),30)});
$("#addDone").addEventListener("click",()=>{$("#addSheet").hidden=true;$("#addBtn").focus()});
$("#addSheet").addEventListener("click",e=>{if(e.target.id==="addSheet")$("#addSheet").hidden=true});
$("#addQ").addEventListener("input",renderAdd);
$("#cAdd").addEventListener("click",()=>{
 const cd=$("#cCode").value.trim().replace(/[<>&"']/g,""),n=$("#cName").value.trim().replace(/[<>&"']/g,"")||cd,p=parseFloat($("#cPrice").value.replace(/[,，\s$¥]/g,""));
 if(!n||!(p>0)){toast(t("cusErr"));return}
 const c={id:"c"+Date.now().toString(36),name:n.slice(0,24),code:(cd||"—").toUpperCase().slice(0,10),price:p,cu:$("#cCur").value};
 S.custom.push(c);INS.push(mkCustom(c));S.px[c.id]=p;S.sel.push(c.id);
 cache={};stamp=new Date();saveS();
 ["#cName","#cCode","#cPrice"].forEach(s=>$(s).value="");
 render();toast(t("added",{n:c.name}));
});
$("#addList").addEventListener("click",e=>{
 const b=e.target.closest(".opt");if(!b)return;
 if(b.id==="useQ"){
  const q=($("#addQ").value||"").trim().replace(/[<>&"']/g,"").slice(0,24);
  $("#cName").value=q;$("#cCode").value=q.toUpperCase().slice(0,10);
  const u=q.toUpperCase();$("#cCur").value=/USD$|\$$/.test(u)?"USD":/JPY$|円$/.test(u)?"JPY":$("#cCur").value;
  $("#cPrice").focus();toast(t("useQHint"));return}
 const id=b.dataset.id;
 S.sel=INS.filter(x=>S.sel.includes(x.id)||x.id===id).map(x=>x.id);
 saveS();render();toast(t("added",{n:INS.find(x=>x.id===id).n[lang]}));
});
$("#chips").addEventListener("click",e=>{
 const b=e.target.closest(".chip");if(!b)return;const id=b.dataset.id,i=S.sel.indexOf(id);
 if(i>=0){if(S.sel.length===1){toast(t("minOne"));return}S.sel.splice(i,1)}
 else{S.sel=INS.filter(x=>S.sel.includes(x.id)||x.id===id).map(x=>x.id)}
 saveS();render();
});
$("#baseSel").addEventListener("change",e=>{S.base=e.target.value;S.tf={};saveS();render();toast(t("saved"))});
$("#pxList").addEventListener("change",e=>{
 const i=e.target.closest("input");if(!i)return;
 const v=parseFloat(i.value.replace(/[,，\s$]/g,""));
 if(v>0)S.px[i.dataset.id]=v;else delete S.px[i.dataset.id];
 cache={};stamp=new Date();saveS();render();toast(t("pxSaved"));
});
$("#pxReset").addEventListener("click",()=>{S.px={};cache={};stamp=new Date();saveS();render();toast(t("pxReseted"))});
$("#cJp").addEventListener("click",()=>{S.color="jp";saveS();render()});
$("#cGl").addEventListener("click",()=>{S.color="gl";saveS();render()});
[["#cyOrig","orig"],["#cyJPY","JPY"],["#cyUSD","USD"]].forEach(([s,v])=>$(s).addEventListener("click",()=>{S.ccy=v;saveS();render();toast(t("ccySaved"))}));
$("#sDef").addEventListener("click",()=>{S.sort="def";render()});
$("#sMov").addEventListener("click",()=>{S.sort="move";render()});
$("#refBtn").addEventListener("click",()=>{salt++;cache={};stamp=new Date();render();toast(t("refreshed"))});
function setGuide(on){
 $("#guide").hidden=!on;
 try{localStorage.setItem("mp_guide",on?"1":"0")}catch(e){}
}
(function(){let g="1";try{g=localStorage.getItem("mp_guide")||"1"}catch(e){}$("#guide").hidden=(g==="0")})();
$("#guideClose").addEventListener("click",()=>setGuide(false));
$("#helpBtn").addEventListener("click",()=>{setGuide(true);window.scrollTo({top:0,behavior:"smooth"})});
$("#guideTry").addEventListener("click",()=>{openDetail(S.sel[0]);if(isDesk())$("#detail").scrollIntoView({behavior:"smooth",block:"nearest"})});
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{
 lang=b.dataset.lang;try{localStorage.setItem("lang",lang)}catch(e){}render();
}));
window.addEventListener("resize",()=>{if(isDesk())document.body.classList.remove("dopen");const c=S.cur;ensureCur();if(c!==S.cur){renderList();renderDetail()}});
render();
let lastKey=slotKey();
function autoCheck(){const k=slotKey();if(k!==lastKey){lastKey=k;cache={};stamp=new Date();render();toast(t("autoUpd"))}}
setInterval(autoCheck,30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)autoCheck()});
</script>
</body>
</html>
